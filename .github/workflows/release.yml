name: Release to GitHub Pages

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# Serialize releases across tags; never interrupt an active publication.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build release
    if: github.event.deleted == false && github.event.forced == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the immutable event commit, not a branch or a movable tag name.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify version tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release or reuse it on retry
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.slice('refs/tags/'.length);
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag,
              }));
            } catch (error) {
              if (error.status !== 404) throw error;
              ({ data: release } = await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                name: tag,
                draft: false,
                prerelease: false,
                generate_release_notes: true,
                make_latest: 'legacy',
              }));
            }
            if (release.draft || release.prerelease) {
              throw new Error('This tag already has a draft or prerelease. Resolve it before retrying.');
            }
            core.info(`Release ready: ${release.html_url}`);

  deploy:
    name: Deploy Pages
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
