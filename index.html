<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9f5" />
    <script>
      // Apply the saved appearance before the app and its styles paint.
      (() => {
        let preference = "system";
        try {
          preference = localStorage.getItem("cotd-theme-pref") || "system";
        } catch {}
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            preference !== "dark" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#101b16"
          : "#f8f9f5";
      })();
    </script>
    <meta
      name="description"
      content="Creatures of the Deep 怪物点位指南：对照地图停船，查看怪物诱饵投放参考，了解冒泡定位与垂钓方法。"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>怪物钓点 · Creatures of the Deep 点位指南</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
